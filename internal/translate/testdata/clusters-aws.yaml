report:
  destinations:
  - 'clusters: eks'
  - 'network: vpc'
  entries:
  - losses:
    - field: properties.agentPoolProfiles[nodes].mode
      why: a System pool was kept for the cluster's own pods; the target has no such
        pool, so they schedule on any node unless the pool is tainted for them
    - field: properties.networkProfile.outboundType
      why: the nodes' traffic out followed the subnet's route table (to a firewall,
        as a rule); see that subnet's routeTable loss on its network
    - field: properties.networkProfile.podCidr
      why: '10.245.0.0/16: EKS''s pods take addresses from the nodes'' subnets (VPC
        CNI), not from a range of their own: the subnets must have room for every
        node''s pods, and what reaches a pod is what the node''s security group lets
        through'
    - field: properties.networkProfile.networkPolicy
      why: 'calico: the VPC CNI enforces Kubernetes NetworkPolicy objects, not Calico''s
        own (NetworkPolicy and GlobalNetworkPolicy in projectcalico.org); whatever
        those denied is let through until that engine is installed on the cluster'
      widens: true
    source: Microsoft.ContainerService/managedClusters rg/priv
    state: mapped with losses
    targets:
    - AWS::EKS::Addon priv_vpc-cni
    - AWS::EKS::Cluster priv
    - AWS::EKS::Nodegroup priv-nodes
  - losses:
    - field: properties.aadProfile
      why: Entra ID sign-in, its admin groups and Azure RBAC for Kubernetes are not
        translated (#32)
    - field: properties.identityProfile
      why: the kubelet's managed identity is not translated (#32)
    - field: identity
      why: 'the cluster''s managed identity is not translated (#32): the control plane
        runs as the IAM role the map names'
    - field: properties.kubernetesVersion
      why: '1.31.2: the target runs its own patch release of 1.31; only the minor
        version is carried over'
    - field: properties.agentPoolProfiles[system].osSKU
      why: 'Ubuntu: the target''s nodes run the target''s own Linux (EKS: the Amazon
        Linux AMI it gives the instance type; GKE: Ubuntu where this was Ubuntu, Container-Optimized
        OS otherwise)'
    - field: properties.agentPoolProfiles[system].mode
      why: a System pool was kept for the cluster's own pods; the target has no such
        pool, so they schedule on any node unless the pool is tainted for them
    - field: properties.agentPoolProfiles[user].osSKU
      why: 'AzureLinux: the target''s nodes run the target''s own Linux (EKS: the
        Amazon Linux AMI it gives the instance type; GKE: Ubuntu where this was Ubuntu,
        Container-Optimized OS otherwise)'
    - field: properties.agentPoolProfiles[user].enableEncryptionAtHost
      why: the nodes' temporary disks and caches were encrypted on the host; EKS's
        node volumes are not encrypted unless the account encrypts EBS by default
        (not translated)
      widens: true
    - field: properties.addonProfiles.azurepolicy
      why: the Azure Policy add-on enforced policies at admission (Gatekeeper); until
        the target's (Gatekeeper, Kyverno or GKE Policy Controller) is installed with
        the same policies, what it denied is let in
      widens: true
    - field: properties.addonProfiles.omsagent
      why: 'Container Insights monitoring is not translated (#32): the target''s (CloudWatch
        Container Insights, Cloud Monitoring) is set on its own'
    - field: properties.networkProfile.dnsServiceIP
      why: 'the target puts the cluster''s DNS at an address of its own in the service
        range: pods resolve through it as before, and anything that names the address
        itself (not kube-dns) is changed'
    - field: properties.autoUpgradeProfile.upgradeChannel
      why: 'patch: EKS does not upgrade the cluster''s Kubernetes version itself;
        upgrades are run by hand'
    - field: properties.autoUpgradeProfile.nodeOSUpgradeChannel
      why: 'NodeImage: EKS managed node groups do not take new node images themselves;
        update them by hand or on a schedule'
    - field: properties.networkProfile.podCidr
      why: '10.244.0.0/16: EKS''s pods take addresses from the nodes'' subnets (VPC
        CNI), not from a range of their own: the subnets must have room for every
        node''s pods, and what reaches a pod is what the node''s security group lets
        through'
    - field: properties.agentPoolProfiles[system].availabilityZones
      why: the pool's nodes were spread over zones 1, 2, 3; an AWS subnet is in one
        zone, so they are all in eu-west-1a
    - field: properties.agentPoolProfiles[system].maxPods
      why: '30: the VPC CNI sets how many pods a node takes from its instance type''s
        network interfaces'
    - field: properties.agentPoolProfiles[user].enableAutoScaling
      why: 'EKS does not scale node groups itself: the bounds are written, and the
        Cluster Autoscaler or Karpenter, installed on the cluster, does the scaling'
    - field: properties.agentPoolProfiles[user].maxPods
      why: '50: the VPC CNI sets how many pods a node takes from its instance type''s
        network interfaces'
    - field: properties.agentPoolProfiles[user].upgradeSettings
      why: EKS upgrades a node group with its own surge; the source's surge is not
        carried over
    source: Microsoft.ContainerService/managedClusters rg/shop
    state: mapped with losses
    targets:
    - AWS::EKS::Addon shop_vpc-cni
    - AWS::EKS::Cluster shop
    - AWS::EKS::Nodegroup shop-batch
    - AWS::EKS::Nodegroup shop-system
    - AWS::EKS::Nodegroup shop-user
    - AWS::EKS::Nodegroup shop-win
  - reason: its cluster is not in the snapshot
    source: Microsoft.ContainerService/managedClusters/agentPools rg/gone/pool
    state: refused
  - reason: read with its cluster Microsoft.ContainerService/managedClusters rg/shop
    source: Microsoft.ContainerService/managedClusters/agentPools rg/shop/batch
    state: mapped
  - reason: 'planned maintenance windows are not translated: EKS has none, and GKE''s
      maintenance policy is set on its own, so upgrades would run when the target
      schedules them'
    source: Microsoft.ContainerService/managedClusters/maintenanceConfigurations rg/shop/default
    state: refused
  - reason: 'identity is not translated (#32): a trusted access binding lets another
      Azure resource''s managed identity into the cluster; the target''s equivalent
      (EKS access entries, GKE IAM) is set on its own'
    source: Microsoft.ContainerService/managedClusters/trustedAccessRoleBindings rg/shop/backup
    state: refused
  - reason: 'Azure''s report of the upgrades open to the cluster: nothing to translate'
    source: Microsoft.ContainerService/managedClusters/upgradeProfiles rg/shop/default
    state: mapped
  - source: Microsoft.Network/networkSecurityGroups net/web
    state: mapped
    targets:
    - AWS::EC2::SecurityGroup web
  - source: Microsoft.Network/virtualNetworks net/core
    state: mapped
    targets:
    - AWS::EC2::Subnet core-app
    - AWS::EC2::Subnet core-data
    - AWS::EC2::Subnet core-spare
    - AWS::EC2::VPC core
  from: azure
  requirements:
  - 'A cluster''s workloads are not in this translation: restore TruthForm''s Kubernetes
    snapshot of Microsoft.ContainerService/managedClusters rg/priv into the EKS cluster
    once it runs; persistent volumes'' data is not moved, and is copied on its own'
  - 'A cluster''s workloads are not in this translation: restore TruthForm''s Kubernetes
    snapshot of Microsoft.ContainerService/managedClusters rg/shop into the EKS cluster
    once it runs; persistent volumes'' data is not moved, and is copied on its own'
  - 'EKS cluster priv takes no one''s access from Azure: add access entries for the
    people and tools that use it before restoring its workloads (#32)'
  - 'EKS cluster priv''s API server answers only inside its VPC: kubectl and the restore
    of its workloads run from there'
  - 'EKS cluster shop answers on its public endpoint only, as the AKS one did: its
    nodes reach it through the subnets'' internet egress, so they need a NAT gateway,
    and its address must be among the allowed ranges (203.0.113.0/24)'
  - 'EKS cluster shop runs Windows nodes: Windows support (the VPC CNI''s Windows
    IPAM) is turned on, and a Linux node group runs the cluster''s own pods'
  - 'EKS cluster shop takes no one''s access from Azure: add access entries for the
    people and tools that use it before restoring its workloads (#32)'
  - EKS node group shop-batch's nodes are in the cluster's security group; security
    group web, translated from their subnet's NSG, applies to them only through a
    launch template (not translated)
  - EKS node group shop-system's nodes are in the cluster's security group; security
    group web, translated from their subnet's NSG, applies to them only through a
    launch template (not translated)
  - EKS node group shop-user's nodes are in the cluster's security group; security
    group web, translated from their subnet's NSG, applies to them only through a
    launch template (not translated)
  - EKS node group shop-win's nodes are in the cluster's security group; security
    group web, translated from their subnet's NSG, applies to them only through a
    launch template (not translated)
  - 'EKS validates Kubernetes 1.30 at restore: if it no longer offers that version,
    a person chooses one, as the translation never upgrades'
  - 'EKS validates Kubernetes 1.31 at restore: if it no longer offers that version,
    a person chooses one, as the translation never upgrades'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the API server''s address
    changes: kubeconfigs, CI and anything else that names the AKS address take the
    target''s'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the cluster had local accounts
    (its admin kubeconfig); the target has none: tools that used them sign in through
    the target''s IAM'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the cluster provisioned storage
    through Azure''s CSI drivers (diskCSIDriver): StorageClasses that name disk.csi.azure.com
    or file.csi.azure.com are rewritten for the target''s (EBS CSI driver, which needs
    its own IAM role, or GKE''s Persistent Disk driver), and the volumes'' data is
    not moved'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the cluster''s service account
    token issuer changes: federated credentials that trusted the AKS issuer are made
    again against the target''s (#32)'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the nodes reached the internet
    through Azure''s outbound (loadBalancer); the target''s subnets have no internet
    egress until a NAT gateway (AWS) or Cloud NAT (GCP) is added, and nodes cannot
    pull public images without it'
  - 'Microsoft.ContainerService/managedClusters rg/shop: what the cluster''s managed
    identity was granted in Azure (its network, its node resources, a key vault for
    secrets encryption) is granted to the target''s cluster role on its own (#32)'
  - 'Microsoft.ContainerService/managedClusters rg/shop: what the kubelet''s managed
    identity was granted (pulling from a container registry, above all) is granted
    to the target''s node role or service account on its own (#32)'
  - 'Microsoft.ContainerService/managedClusters rg/shop: who may use the cluster is
    set on the target on its own (#32): EKS access entries, or GKE''s IAM and Google
    Groups for RBAC, for the people and groups Entra ID let in'
  - 'Microsoft.ContainerService/managedClusters rg/shop: workloads signed in to Azure
    with workload identity; on the target they use EKS Pod Identity or IRSA, or GKE
    workload identity, set up on its own: the app''s credentials change (#32)'
  - 'Security group web takes the place of an NSG on subnet(s) core-app: an AWS security
    group applies only to what attaches it, so attach it to the instances (and node
    groups) in them'
  to: aws
snapshots:
  aws:
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EC2::SecurityGroup
    metadata:
      annotations:
        truthform.org/write-only: SecurityGroupIngress[].SourceSecurityGroupName
      name: web
    spec:
      GroupDescription: From Azure network security group net/web
      SecurityGroupEgress:
      - CidrIp: 0.0.0.0/0
        IpProtocol: "-1"
      SecurityGroupIngress:
      - CidrIp: 0.0.0.0/0
        FromPort: 443
        IpProtocol: tcp
        ToPort: 443
      - CidrIp: 10.20.0.0/16
        IpProtocol: "-1"
      Tags:
      - Key: Name
        Value: web
      VpcId: '{{truthform|AWS::EC2::VPC|core|VpcId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EC2::Subnet
    metadata:
      annotations:
        truthform.org/write-only: EnableLniAtDeviceIndex,Ipv4IpamPoolId,Ipv4NetmaskLength,Ipv6IpamPoolId,Ipv6NetmaskLength
      name: core-app
    spec:
      AvailabilityZone: eu-west-1a
      CidrBlock: 10.20.1.0/24
      Tags:
      - Key: Name
        Value: core-app
      VpcId: '{{truthform|AWS::EC2::VPC|core|VpcId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EC2::Subnet
    metadata:
      annotations:
        truthform.org/write-only: EnableLniAtDeviceIndex,Ipv4IpamPoolId,Ipv4NetmaskLength,Ipv6IpamPoolId,Ipv6NetmaskLength
      name: core-data
    spec:
      AvailabilityZone: eu-west-1b
      CidrBlock: 10.20.2.0/24
      Tags:
      - Key: Name
        Value: core-data
      VpcId: '{{truthform|AWS::EC2::VPC|core|VpcId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EC2::Subnet
    metadata:
      annotations:
        truthform.org/write-only: EnableLniAtDeviceIndex,Ipv4IpamPoolId,Ipv4NetmaskLength,Ipv6IpamPoolId,Ipv6NetmaskLength
      name: core-spare
    spec:
      AvailabilityZone: eu-west-1c
      CidrBlock: 10.20.3.0/24
      Tags:
      - Key: Name
        Value: core-spare
      VpcId: '{{truthform|AWS::EC2::VPC|core|VpcId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EC2::VPC
    metadata:
      annotations:
        truthform.org/write-only: Ipv4IpamPoolId,Ipv4NetmaskLength,VpcEncryptionControl.EgressOnlyInternetGatewayExclusion,VpcEncryptionControl.ElasticFileSystemExclusion,VpcEncryptionControl.InternetGatewayExclusion,VpcEncryptionControl.LambdaExclusion,VpcEncryptionControl.NatGatewayExclusion,VpcEncryptionControl.VirtualPrivateGatewayExclusion,VpcEncryptionControl.VpcLatticeExclusion,VpcEncryptionControl.VpcPeeringExclusion
      name: core
    spec:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Name
        Value: core
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Addon
    metadata:
      annotations:
        truthform.org/write-only: PodIdentityAssociations,PreserveOnDelete,ResolveConflicts
      name: priv_vpc-cni
    spec:
      AddonName: vpc-cni
      ClusterName: '{{truthform|AWS::EKS::Cluster|priv|identifier}}'
      ConfigurationValues: '{"enableNetworkPolicy":"true"}'
      ResolveConflicts: OVERWRITE
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Addon
    metadata:
      annotations:
        truthform.org/write-only: PodIdentityAssociations,PreserveOnDelete,ResolveConflicts
      name: shop_vpc-cni
    spec:
      AddonName: vpc-cni
      ClusterName: '{{truthform|AWS::EKS::Cluster|shop|identifier}}'
      ConfigurationValues: '{"enableNetworkPolicy":"true"}'
      ResolveConflicts: OVERWRITE
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Cluster
    metadata:
      annotations:
        truthform.org/write-only: AccessConfig.BootstrapClusterCreatorAdminPermissions,ActiveCertificateAuthorityId,BootstrapSelfManagedAddons,Force,RollbackConfig
      name: priv
    spec:
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 10.1.0.0/16
      Name: priv
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
        SubnetIds:
        - '{{truthform|AWS::EC2::Subnet|core-data|SubnetId}}'
        - '{{truthform|AWS::EC2::Subnet|core-spare|SubnetId}}'
      RoleArn: arn:aws:iam::{{truthform|account|self|id}}:role/eks-priv
      UpgradePolicy:
        SupportType: STANDARD
      Version: "1.30"
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Cluster
    metadata:
      annotations:
        truthform.org/write-only: AccessConfig.BootstrapClusterCreatorAdminPermissions,ActiveCertificateAuthorityId,BootstrapSelfManagedAddons,Force,RollbackConfig
      name: shop
    spec:
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      EncryptionConfig:
      - Provider:
          KeyArn: arn:aws:kms:eu-west-1:{{truthform|account|self|id}}:key/0b2c3d4e-1111-2222-3333-444455556666
        Resources:
        - secrets
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 10.0.0.0/16
      Name: shop
      ResourcesVpcConfig:
        EndpointPrivateAccess: false
        EndpointPublicAccess: true
        PublicAccessCidrs:
        - 203.0.113.0/24
        SubnetIds:
        - '{{truthform|AWS::EC2::Subnet|core-app|SubnetId}}'
        - '{{truthform|AWS::EC2::Subnet|core-data|SubnetId}}'
      RoleArn: arn:aws:iam::{{truthform|account|self|id}}:role/eks-shop
      Tags:
      - Key: Cost Centre
        Value: "42"
      - Key: env
        Value: prod
      UpgradePolicy:
        SupportType: STANDARD
      Version: "1.31"
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Nodegroup
    metadata:
      annotations:
        truthform.org/write-only: ForceUpdateEnabled
      name: priv-nodes
    spec:
      CapacityType: ON_DEMAND
      ClusterName: '{{truthform|AWS::EKS::Cluster|priv|identifier}}'
      DiskSize: 64
      InstanceTypes:
      - m7i.large
      NodeRepairConfig:
        Enabled: true
      NodeRole: arn:aws:iam::{{truthform|account|self|id}}:role/eks-priv-nodes
      NodegroupName: priv-nodes
      ScalingConfig:
        DesiredSize: 2
        MaxSize: 2
        MinSize: 2
      Subnets:
      - '{{truthform|AWS::EC2::Subnet|core-data|SubnetId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Nodegroup
    metadata:
      annotations:
        truthform.org/write-only: ForceUpdateEnabled
      name: shop-batch
    spec:
      CapacityType: ON_DEMAND
      ClusterName: '{{truthform|AWS::EKS::Cluster|shop|identifier}}'
      DiskSize: 128
      InstanceTypes:
      - r7i.xlarge
      NodeRepairConfig:
        Enabled: true
      NodeRole: arn:aws:iam::{{truthform|account|self|id}}:role/eks-shop-nodes
      NodegroupName: shop-batch
      ScalingConfig:
        DesiredSize: 2
        MaxSize: 2
        MinSize: 2
      Subnets:
      - '{{truthform|AWS::EC2::Subnet|core-app|SubnetId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Nodegroup
    metadata:
      annotations:
        truthform.org/write-only: ForceUpdateEnabled
      name: shop-system
    spec:
      CapacityType: ON_DEMAND
      ClusterName: '{{truthform|AWS::EKS::Cluster|shop|identifier}}'
      DiskSize: 128
      InstanceTypes:
      - m7i.xlarge
      NodeRepairConfig:
        Enabled: true
      NodeRole: arn:aws:iam::{{truthform|account|self|id}}:role/eks-shop-nodes
      NodegroupName: shop-system
      ScalingConfig:
        DesiredSize: 3
        MaxSize: 3
        MinSize: 3
      Subnets:
      - '{{truthform|AWS::EC2::Subnet|core-app|SubnetId}}'
      Taints:
      - Effect: NO_SCHEDULE
        Key: CriticalAddonsOnly
        Value: "true"
      Version: "1.31"
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Nodegroup
    metadata:
      annotations:
        truthform.org/write-only: ForceUpdateEnabled
      name: shop-user
    spec:
      CapacityType: SPOT
      ClusterName: '{{truthform|AWS::EKS::Cluster|shop|identifier}}'
      DiskSize: 256
      InstanceTypes:
      - m7i.2xlarge
      Labels:
        workload: web
      NodeRepairConfig:
        Enabled: true
      NodeRole: arn:aws:iam::{{truthform|account|self|id}}:role/eks-shop-nodes
      NodegroupName: shop-user
      ScalingConfig:
        DesiredSize: 2
        MaxSize: 6
        MinSize: 2
      Subnets:
      - '{{truthform|AWS::EC2::Subnet|core-app|SubnetId}}'
  - apiVersion: aws.truthform.org/v1
    kind: AWS::EKS::Nodegroup
    metadata:
      annotations:
        truthform.org/write-only: ForceUpdateEnabled
      name: shop-win
    spec:
      AmiType: WINDOWS_CORE_2022_x86_64
      CapacityType: ON_DEMAND
      ClusterName: '{{truthform|AWS::EKS::Cluster|shop|identifier}}'
      DiskSize: 128
      InstanceTypes:
      - m7i.xlarge
      NodeRepairConfig:
        Enabled: true
      NodeRole: arn:aws:iam::{{truthform|account|self|id}}:role/eks-shop-nodes
      NodegroupName: shop-win
      ScalingConfig:
        DesiredSize: 2
        MaxSize: 2
        MinSize: 2
      Subnets:
      - '{{truthform|AWS::EC2::Subnet|core-app|SubnetId}}'
      Taints:
      - Effect: NO_SCHEDULE
        Key: os
        Value: windows
