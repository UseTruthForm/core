apiVersion: azure.stackdna.org/v1
kind: Microsoft.Authorization/roleAssignments
metadata:
  annotations:
    stackdna.org/after:
      - Microsoft.ManagedIdentity/userAssignedIdentities|rg-app/id-app
    stackdna.org/api-version: "2022-04-01"
    stackdna.org/id: /subscriptions/{{stackdna|subscription}}/providers/Microsoft.Authorization/roleAssignments/ra-app
  name: ra-app
spec:
  properties:
    description: tenant {{stackdna|tenant}} reader
    principalId: "{{stackdna|ref|Microsoft.ManagedIdentity/userAssignedIdentities|rg-app/id-app|properties.principalId}}"
    scope: /subscriptions/{{stackdna|subscription}}
