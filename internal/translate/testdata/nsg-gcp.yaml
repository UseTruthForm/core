  - losses:
    - field: properties.format.version
      why: 'version 2 of Azure''s record is not what the target writes: a parser reads
        each cloud''s own record (the guide''s record-field table lines them up)'
    - field: properties.targetResourceId
      why: 'an NSG flow log, the kind Azure retires on September 30, 2027 in favour
        of virtual network flow logs: the target logs networks, not rule sets, so
        the whole of each network its NSG is used in is logged, which is more'
    - field: properties.storageId
      why: storage account shoplogs held the records; GCP writes them to Cloud Logging
        (log compute.googleapis.com/vpc_flows), and a sink carries them on to a bucket,
        BigQuery or Pub/Sub
    - field: properties.format
      why: 'the target writes its own record, not Azure''s: one entry per flow and
        reporting side with bytes and packets one way; packets an ingress rule denied
        are not recorded at all unless firewall rule logging is turned on'
