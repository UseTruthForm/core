name: Bug
description: TruthForm did something wrong, or failed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out anything from a real environment: names, IDs, keys and snapshots. A snapshot can hold what TruthForm could not withhold. A security problem goes through **Report a vulnerability**, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `truthform version`
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Kubernetes, AWS, Azure, GCP, GitHub, Cloudflare, translate, MCP server, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran, and what it printed
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
