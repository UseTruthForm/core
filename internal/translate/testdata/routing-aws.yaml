  - losses:
    - field: properties.subnets[app].properties.natGateway
      why: 'its route table sends every destination elsewhere, which comes before
        its NAT gateway on Azure too: the subnet is given no route to the target''s
        NAT'
    - field: properties.subnets[app].properties.routeTable
      why: 'route default (0.0.0.0/0 to virtual appliance 10.10.0.4): the appliance
        is a machine, which is not translated: the subnet is given no route for these
        destinations, so that traffic goes nowhere until a route to an inspection
        appliance on the target is added'
    - field: properties.subnets[data].properties.routeTable
      why: 'route storage-direct (Storage to the internet) names a service tag, which
        has no addresses here: its traffic follows the subnet''s other routes'
    - field: properties.subnets[east].properties.routeTable
      why: route inspect (10.20.0.0/16 to virtual appliance 10.20.9.4) covers 10.20.0.0/22,
        10.20.4.0/24, 10.20.6.0/23, 10.20.8.0/21, and 4 more of the network's own
        range; an AWS route table always delivers the VPC's own range directly (its
        local route cannot be dropped, and can be pointed only at an interface or
        endpoint that is not translated), so that traffic is delivered where Azure
        dropped it or sent it through the appliance
      widens: true
    source: Microsoft.Network/virtualNetworks net/spoke
