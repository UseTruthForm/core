report:
  destinations:
  - 'network: vpc'
  entries:
  - losses:
    - field: zones
      why: it was in zone [1]; the target's NAT is in the zone of the map's egress
        subnet (AWS) or regional (GCP)
    source: Microsoft.Network/natGateways net/hub-nat
    state: mapped with losses
    targets:
    - compute.googleapis.com/Address projects/{{truthform|project}}/regions/europe-west1/addresses/hub-nat-1
    - compute.googleapis.com/Router projects/{{truthform|project}}/regions/europe-west1/routers/hub-nat
  - losses:
    - field: tags
      why: '1 tag(s): a Cloud NAT gateway has no tags or labels to hold them'
    source: Microsoft.Network/natGateways net/spoke-nat
    state: mapped with losses
    targets:
    - compute.googleapis.com/Address projects/{{truthform|project}}/regions/europe-west1/addresses/spoke-nat-1
    - compute.googleapis.com/Address projects/{{truthform|project}}/regions/europe-west1/addresses/spoke-nat-2
    - compute.googleapis.com/Address projects/{{truthform|project}}/regions/europe-west1/addresses/spoke-nat-3
    - compute.googleapis.com/Router projects/{{truthform|project}}/regions/europe-west1/routers/spoke-nat
  - source: Microsoft.Network/networkSecurityGroups net/web
    state: mapped
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-8080-internet
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-https-vnet
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allowvnetinbound
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-deny-rest
  - losses:
    - field: properties.ipAddress
      why: '198.51.100.7 is Azure''s: the target sends from an address of its own'
    reason: 'read with its NAT gateway Microsoft.Network/natGateways net/hub-nat:
      the target''s NAT sends from as many addresses of its own'
    source: Microsoft.Network/publicIPAddresses net/hub-ip
    state: mapped with losses
  - reason: no descriptor yet for a public address that no NAT gateway in the snapshot
      uses (one of a load balancer, a gateway or a machine)
    source: Microsoft.Network/publicIPAddresses net/lb-ip
    state: not looked at
  - losses:
    - field: properties.ipAddress
      why: '198.51.100.8 is Azure''s: the target sends from an address of its own'
    reason: 'read with its NAT gateway Microsoft.Network/natGateways net/spoke-nat:
      the target''s NAT sends from as many addresses of its own'
    source: Microsoft.Network/publicIPAddresses net/spoke-ip
    state: mapped with losses
  - reason: 'read with its NAT gateway Microsoft.Network/natGateways net/spoke-nat:
      the target''s NAT sends from as many addresses of its own'
    source: Microsoft.Network/publicIPPrefixes net/spoke-prefix
    state: mapped
  - source: Microsoft.Network/routeTables net/data-rt
    state: mapped
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/spoke-data-no-route
  - source: Microsoft.Network/routeTables net/east-west
    state: mapped
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/spoke-east-no-route
  - reason: no subnet in the snapshot uses it, so there is no subnet to give its routes
      to
    source: Microsoft.Network/routeTables net/spare
    state: refused
  - losses:
    - field: tags
      why: a route table's routes are written into each subnet's own routes on the
        target; its tags are not carried over
    source: Microsoft.Network/routeTables net/to-firewall
    state: mapped with losses
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/spoke-app-no-route
  - reason: read with its route table Microsoft.Network/routeTables net/data-rt
    source: Microsoft.Network/routeTables/routes net/data-rt/drop-shared
    state: mapped
  - source: Microsoft.Network/virtualNetworks net/hub
    state: mapped
    targets:
    - compute.googleapis.com/Network projects/{{truthform|project}}/global/networks/hub
    - compute.googleapis.com/Route projects/{{truthform|project}}/global/routes/hub-internet
    - compute.googleapis.com/Router projects/{{truthform|project}}/regions/europe-west1/routers/hub-nat
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/hub-firewall
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/hub-shared
  - source: Microsoft.Network/virtualNetworks net/lone
    state: mapped
    targets:
    - compute.googleapis.com/Network projects/{{truthform|project}}/global/networks/lone
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/lone-only
  - losses:
    - field: properties.subnets[app].properties.natGateway
      why: 'its route table sends every destination elsewhere, which comes before
        its NAT gateway on Azure too: the subnet is given no route to the target''s
        NAT'
    - field: properties.subnets[app].properties.routeTable
      why: 'route default (0.0.0.0/0 to virtual appliance 10.10.0.4): the appliance
        is a machine, which is not translated, and a GCP route''s next hop must be
        one in the network: egress deny rule spoke-app-no-route keeps these destinations
        off the network''s default route, so that traffic goes nowhere until a route
        through an inspection appliance on the target is added'
    - field: properties.subnets[app].properties.routeTable
      why: 'egress deny rule spoke-app-no-route leaves 199.36.153.8/30, 199.36.153.4/30
        open (private.googleapis.com and restricted.googleapis.com): Private Google
        Access reaches Google''s APIs through them, and they are not on the internet'
    - field: properties.subnets[data].properties.routeTable
      why: 'route storage-direct (Storage to the internet) names a service tag, which
        has no addresses here: its traffic follows the subnet''s other routes'
    - field: properties.subnets[east].properties.routeTable
      why: route inspect (10.20.0.0/16 to virtual appliance 10.20.9.4) covers 10.20.0.0/22,
        10.20.4.0/24, 10.20.6.0/23, 10.20.8.0/21, and 4 more of the network's own
        range; a subnet's own route cannot be overridden on GCP, so egress deny rule
        spoke-east-no-route drops that traffic, where Azure dropped it or sent it
        through the appliance
    source: Microsoft.Network/virtualNetworks net/spoke
    state: mapped with losses
    targets:
    - compute.googleapis.com/Network projects/{{truthform|project}}/global/networks/spoke
    - compute.googleapis.com/Route projects/{{truthform|project}}/global/routes/spoke-internet
    - compute.googleapis.com/Router projects/{{truthform|project}}/regions/europe-west1/routers/spoke-nat
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/spoke-app
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/spoke-batch
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/spoke-data
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/spoke-east
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/spoke-jobs
  - reason: 'a GCP peering is made by a call on each network (networks.addPeering),
      not by creating a resource, and a restore only creates resources: it is not
      written. Make it once the networks exist: gcloud compute networks peerings create
      to-spoke --network=hub --peer-network=spoke'
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/hub/to-spoke
    state: refused
  - reason: 'it peers with /subscriptions/00000000-0000-0000-0000-00000000c0de/resourceGroups/central/providers/Microsoft.Network/virtualNetworks/central-hub,
      which is not in the snapshot (a network in another subscription, or one the
      capture left out): the target network would not reach it. A peering to a network
      that is not translated is not written (a map entry naming an existing VPC or
      network on the target for it does not exist yet)'
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/lone/to-central
    state: refused
  - reason: 'a GCP peering is made by a call on each network (networks.addPeering),
      not by creating a resource, and a restore only creates resources: it is not
      written. Make it once the networks exist: gcloud compute networks peerings create
      to-hub --network=spoke --peer-network=hub'
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/spoke/to-hub
    state: refused
  from: azure
  requirements:
  - 'Cloud NAT gateway default-outbound on router spoke-nat stands for Azure''s default
    outbound access in network net/spoke, as the map chose (network.defaultOutbound):
    it is billed by the hour and the gigabyte'
  - Cloud NAT serves machines with no external address; one given an external address
    leaves by it instead (docs.cloud.google.com/nat/docs/public-nat), as a machine
    with a public IP did on Azure only where no NAT gateway or route came first
  - 'Google''s load balancers check health from 35.191.0.0/16 and 130.211.0.0/22:
    where one fronts these instances, allow those ranges (Azure''s load balancer was
    allowed by every NSG)'
  - 'Instances (and GKE nodes) in subnetwork(s) spoke-app carry the network tag web:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  - 'Peer network hub with spoke by hand, on both sides, once they are restored (gcloud
    compute networks peerings create to-spoke --network=hub --peer-network=spoke):
    the firewall rules written from the NSGs already take the peer''s ranges as part
    of the network, as Azure''s VirtualNetwork tag did, and the subnets'' routes leave
    the peer''s ranges alone. GCP peering gives no transit to a third network (docs.cloud.google.com/vpc/docs/vpc-peering)'
  - 'Peer network spoke with hub by hand, on both sides, once they are restored (gcloud
    compute networks peerings create to-hub --network=spoke --peer-network=hub): the
    firewall rules written from the NSGs already take the peer''s ranges as part of
    the network, as Azure''s VirtualNetwork tag did, and the subnets'' routes leave
    the peer''s ranges alone. GCP peering gives no transit to a third network (docs.cloud.google.com/vpc/docs/vpc-peering)'
  - 'Subnetwork spoke-app sent its traffic through a firewall on Azure, and reaches
    nothing outside its network on GCP but 199.36.153.8/30, 199.36.153.4/30: where
    its network has Private Google Access, point googleapis.com at private.googleapis.com
    in a private DNS zone (not translated) for its machines to reach Google''s APIs'
  - 'Traffic that left through NAT gateway hub-nat now leaves from the target''s own
    addresses: whoever allows the old ones by address (a partner''s firewall, an allowlist)
    must be given the new ones'
  - 'Traffic that left through NAT gateway spoke-nat now leaves from the target''s
    own addresses: whoever allows the old ones by address (a partner''s firewall,
    an allowlist) must be given the new ones'
  to: gcp
