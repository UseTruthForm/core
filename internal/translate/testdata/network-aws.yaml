report:
  destinations:
  - 'network: vpc'
  entries:
  - losses:
    - field: properties.securityRules[AllowVnetInBound]
      why: inbound allow rule AllowVnetInBound (priority 65000) allows every protocol,
        and a deny before it takes out tcp; a security group cannot write every protocol
        but one, so it allows TCP, UDP, ICMP, ESP and AH, and no other protocol (GRE,
        SCTP and the like)
    source: Microsoft.Network/networkSecurityGroups net/data
    state: mapped with losses
    targets:
    - AWS::EC2::SecurityGroup data
  - reason: no subnet in the snapshot uses it (one on a network interface is not translated
      yet), so there is no network to put it in
    source: Microsoft.Network/networkSecurityGroups net/unused
    state: refused
  - losses:
    - field: properties.securityRules[deny-azurecloud]
      why: inbound deny rule deny-azurecloud (priority 150) names AzureCloud, which
        has no addresses here; it is taken out of what is allowed for every address
        instead
    - field: properties.securityRules[allow-frontdoor]
      why: inbound allow rule allow-frontdoor (priority 400) allows AzureFrontDoor.Backend,
        which has no addresses here; it is not carried over
    - field: properties.securityRules[allow-ephemeral]
      why: inbound allow rule allow-ephemeral (priority 510) names source ports; a
        security group cannot, so it is not carried over
    - field: properties.securityRules[allow-one-host]
      why: 'inbound allow rule allow-one-host (priority 520) applies to part of its
        subnets'' addresses; a security group applies to whole instances, so it is
        not carried over: give those instances a security group of their own'
    - field: properties.securityRules[AllowVnetInBound]
      why: inbound allow rule AllowVnetInBound (priority 65000) allows every protocol,
        and a deny before it takes out tcp; a security group cannot write every protocol
        but one, so it allows TCP, UDP, ICMP, ESP and AH, and no other protocol (GRE,
        SCTP and the like)
    source: Microsoft.Network/networkSecurityGroups net/web
    state: mapped with losses
    targets:
    - AWS::EC2::SecurityGroup web
  - losses:
    - field: properties.subnets[app].properties.defaultOutboundAccess
      why: 'it reached the internet through Azure''s default outbound access; on the
        target it has no internet egress unless the map makes that a NAT (network.defaultOutbound:
        nat), which is billed'
    - field: properties.subnets[data].properties.routeTable
      why: 'its route table is not in the snapshot: if it sent traffic through a firewall
        appliance or dropped it, the target does not'
      widens: true
    source: Microsoft.Network/virtualNetworks net/core
    state: mapped with losses
    targets:
    - AWS::EC2::Subnet core-app
    - AWS::EC2::Subnet core-data
    - AWS::EC2::VPC core
  - reason: 'it peers with a network it does not name, which is not in the snapshot
      (a network in another subscription, or one the capture left out): the target
      network would not reach it. A peering to a network that is not translated is
      not written (a map entry naming an existing VPC or network on the target for
      it does not exist yet)'
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/core/to-hub
    state: refused
  from: azure
  requirements:
  - Security group data has 65 inbound and 1 outbound rules; AWS's default quota is
    60 per direction, so raise it before a restore
  - 'Security group data takes the place of an NSG on subnet(s) core-data: an AWS
    security group applies only to what attaches it, so attach it to the instances
    (and node groups) in them'
  - 'Security group web takes the place of an NSG on subnet(s) core-app: an AWS security
    group applies only to what attaches it, so attach it to the instances (and node
    groups) in them'
  to: aws
