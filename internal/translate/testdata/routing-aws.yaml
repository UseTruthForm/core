  - losses:
    - field: properties.allowGatewayTransit
      why: the peer could use this network's gateway to reach on-premises; no gateway
        is translated, and a peering on the target gives no transit through one
    reason: a VPC peering connection, with a route to the peer's range in the route
      table of each subnet that reached it
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/hub/to-spoke
    state: mapped with losses
    targets:
    - AWS::EC2::VPCPeeringConnection net-hub-net-spoke
  - reason: 'it peers with /subscriptions/00000000-0000-0000-0000-00000000c0de/resourceGroups/central/providers/Microsoft.Network/virtualNetworks/central-hub,
      which is not in the snapshot (a network in another subscription, or one the
      capture left out): the target network would not reach it. A peering to a network
      that is not translated is not written (a map entry naming an existing VPC or
      network on the target for it does not exist yet)'
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/lone/to-central
    state: refused
  - losses:
    - field: properties.allowForwardedTraffic
      why: 'it accepted traffic the peer forwarded from elsewhere (an appliance or
        gateway in a hub); a peering on the target carries only traffic between the
        two networks'' own ranges, so nothing reaches this network through the peer
        from a third (AWS: a transit gateway; GCP: Network Connectivity Center; neither
        is translated)'
    - field: properties.useRemoteGateways
      why: this network reached on-premises through the peer's gateway; no gateway
        is translated, and a peering on the target gives no transit through one
    reason: written once for both sides, as VPC peering connection net-hub-net-spoke
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/spoke/to-hub
    state: mapped with losses
    targets:
    - AWS::EC2::VPCPeeringConnection net-hub-net-spoke
  from: azure
  requirements:
  - 'A NAT gateway''s public subnet and internet gateway take nothing in from the
    internet by themselves: only a machine put in that subnet with a public address
    would be reachable, and the translation puts none there'
  - 'NAT gateway hub-nat is in one availability zone (eu-west-1a), in public subnet
    hub-egress: add one per zone, with a route table per zone, for egress to survive
    the loss of that zone'
  - 'NAT gateway spoke-default-outbound stands for Azure''s default outbound access
    in network net/spoke, as the map chose (network.defaultOutbound): it is billed
    by the hour and the gigabyte, and its address is fixed where Azure''s was not'
  - NAT gateway spoke-nat has 3 Elastic IP addresses; AWS's default quota is 2 per
    NAT gateway, so raise it before a restore
  - 'NAT gateway spoke-nat is in one availability zone (eu-west-1b), in public subnet
    spoke-egress: add one per zone, with a route table per zone, for egress to survive
    the loss of that zone'
  - 'Security group web takes the place of an NSG on subnet(s) spoke-app: an AWS security
    group applies only to what attaches it, so attach it to the instances (and node
    groups) in them'
  - 'Traffic that left through NAT gateway hub-nat now leaves from the target''s own
    addresses: whoever allows the old ones by address (a partner''s firewall, an allowlist)
    must be given the new ones'
  - 'Traffic that left through NAT gateway spoke-nat now leaves from the target''s
    own addresses: whoever allows the old ones by address (a partner''s firewall,
    an allowlist) must be given the new ones'
  - 'VPC peering connection net-hub-net-spoke joins Microsoft.Network/virtualNetworks
    net/hub and Microsoft.Network/virtualNetworks net/spoke for their own ranges only:
    AWS peering gives no transit to a third network, a gateway or a NAT in the peer
    (docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html)'
  to: aws
