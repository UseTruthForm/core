report:
  destinations:
  - 'secrets: secret-manager'
  entries:
  - losses:
    - field: properties.enableRbacAuthorization
      why: 'who may read its secrets was set by Azure RBAC role assignments: identity
        is not translated (#32), so on the target only those its IAM lets read them
        can'
    reason: 'Secrets Manager has no vault: its secrets are written as secrets of their
      own, named after the vault'
    source: Microsoft.KeyVault/vaults app/open
    state: mapped with losses
  - losses:
    - field: properties.accessPolicies
      why: '2 access policies set who may read its secrets: identity is not translated
        (#32), so on the target only those its IAM lets read them can'
    - field: properties.enabledForTemplateDeployment
      why: 'true: ARM deployments could read its secrets; nothing on the target does
        so'
    - field: properties.sku.name
      why: 'premium: its keys could be HSM-protected; its secrets were stored as a
        standard vault''s are, and keys are not translated'
    - field: tags
      why: '1 tag(s): Secrets Manager has no vault to hold them (each secret keeps
        its own)'
    - field: properties.networkAcls
      why: its firewall denies by default, allowing 1 address range(s) and 0 network(s);
        Secrets Manager answers on its public endpoint, guarded by IAM alone, until
        a VPC endpoint and a policy on aws:SourceVpce are added (not translated yet)
      widens: true
    - field: properties.enablePurgeProtection
      why: 'no one could purge a deleted secret before its 30 days were out; Secrets
        Manager sets the recovery window on each delete, and a delete may skip it
        (ForceDeleteWithoutRecovery) until IAM or a resource policy denies that (identity,
        not translated: #32)'
      widens: true
    reason: 'Secrets Manager has no vault: its secrets are written as secrets of their
      own, named after the vault'
    source: Microsoft.KeyVault/vaults app/shop
    state: mapped with losses
  - reason: 'identity is not translated (#32): an access policy grants an Azure identity
      rights on the vault; grant the app''s new identity read on its secrets instead'
    source: Microsoft.KeyVault/vaults/accessPolicies app/shop/add
    state: refused
  - reason: 'a key''s material never leaves its vault (its HSM or software protection),
      so it cannot be copied: make a new key in AWS KMS and re-encrypt or re-sign
      what this one protected'
    source: Microsoft.KeyVault/vaults/keys app/shop/signing
    state: refused
  - reason: 'a key''s material never leaves its vault (its HSM or software protection),
      so it cannot be copied: make a new key in AWS KMS and re-encrypt or re-sign
      what this one protected'
    source: Microsoft.KeyVault/vaults/keys/versions app/shop/signing/0123
    state: refused
  - reason: made when its private endpoint is created; private endpoints are not translated
      yet
    source: Microsoft.KeyVault/vaults/privateEndpointConnections app/shop/pe-1
    state: not looked at
  - reason: its vault is not in the snapshot, so what guarded it (its network rules,
      purge protection) is not known
    source: Microsoft.KeyVault/vaults/secrets app/gone/orphan
    state: refused
  - losses:
    - field: properties.attributes.nbf
      why: 'not before 2023-11-14T22:13:20Z: Key Vault only records it (a read works
        outside it); Secrets Manager has no such date, and Secret Manager''s expireTime
        deletes the secret, so it is not written'
    source: Microsoft.KeyVault/vaults/secrets app/open/token
    state: mapped with losses
    targets:
    - AWS::SecretsManager::Secret open/token
  - losses:
    - field: name
      why: 'shop/api-abc123 ends in a hyphen and six characters, which AWS advises
        against: a lookup by partial ARN can match the wrong secret; give it another
        in the map''s names'
    source: Microsoft.KeyVault/vaults/secrets app/shop/api-abc123
    state: mapped with losses
    targets:
    - AWS::SecretsManager::Secret shop/api-abc123
  - losses:
    - field: properties.attributes.exp
      why: 'expires 2030-01-01T00:00:00Z: Key Vault only records it (a read works
        outside it); Secrets Manager has no such date, and Secret Manager''s expireTime
        deletes the secret, so it is not written'
    - field: tags.Name
      why: a tag Name would be read as the secret's name; it is not carried over
    source: Microsoft.KeyVault/vaults/secrets app/shop/db-password
    state: mapped with losses
    targets:
    - AWS::SecretsManager::Secret shop/db-password
  - losses:
    - field: properties.value
      why: 'a value in the snapshot is not carried over: a translation writes no secret
        value'
    - field: properties.attributes.enabled
      why: 'disabled on the source, so no read returned its value; Secrets Manager
        has no disabled secret: it is written without a value, and stays unreadable
        only while none is supplied'
    source: Microsoft.KeyVault/vaults/secrets app/shop/legacy
    state: mapped with losses
    targets:
    - AWS::SecretsManager::Secret shop/legacy
  from: azure
  requirements:
  - Apps that read Key Vault app/open (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secrets Manager instead, by the new names (<vault>/<secret>)
  - Apps that read Key Vault app/shop (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secrets Manager instead, by the new names (<vault>/<secret>)
  - 'Key Vault app/open let Azure RBAC role assignments read its secrets; identity
    is not translated (#32): grant each app''s new identity secretsmanager:GetSecretValue
    on the secrets it reads'
  - 'Key Vault app/open''s secrets (open/token) hold no value: a capture never reads
    one, and a translation writes none. Supply each at restore with --values (AWS::SecretsManager::Secret/<name>:
    {SecretString: ...}), read from where its value is kept; the restore lists each
    one created without it'
  - 'Key Vault app/shop let 2 access policies read its secrets; identity is not translated
    (#32): grant each app''s new identity secretsmanager:GetSecretValue on the secrets
    it reads'
  - 'Key Vault app/shop''s secrets (shop/api-abc123, shop/db-password, shop/legacy)
    hold no value: a capture never reads one, and a translation writes none. Supply
    each at restore with --values (AWS::SecretsManager::Secret/<name>: {SecretString:
    ...}), read from where its value is kept; the restore lists each one created without
    it'
  - 'Secret shop/legacy was disabled on the source: restore it without a value (leave
    it out of --values) for as long as it should stay unreadable'
  to: aws
snapshots:
  aws:
  - apiVersion: aws.truthform.org/v1
    kind: AWS::SecretsManager::Secret
    metadata:
      annotations:
        truthform.org/write-only: GenerateSecretString,SecretString
      name: open/token
    spec:
      Description: From Azure Key Vault app/open, secret token
      Name: open/token
  - apiVersion: aws.truthform.org/v1
    kind: AWS::SecretsManager::Secret
    metadata:
      annotations:
        truthform.org/write-only: GenerateSecretString,SecretString
      name: shop/api-abc123
    spec:
      Description: From Azure Key Vault app/shop, secret api-abc123
      Name: shop/api-abc123
  - apiVersion: aws.truthform.org/v1
    kind: AWS::SecretsManager::Secret
    metadata:
      annotations:
        truthform.org/write-only: GenerateSecretString,SecretString
      name: shop/db-password
    spec:
      Description: From Azure Key Vault app/shop, secret db-password; content type
        text/plain
      Name: shop/db-password
      Tags:
      - Key: Owner Team
        Value: data
      - Key: env
        Value: dev
  - apiVersion: aws.truthform.org/v1
    kind: AWS::SecretsManager::Secret
    metadata:
      annotations:
        truthform.org/write-only: GenerateSecretString,SecretString
      name: shop/legacy
    spec:
      Description: From Azure Key Vault app/shop, secret legacy
      Name: shop/legacy
