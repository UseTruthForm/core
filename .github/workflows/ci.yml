name: ci
# Cost-minimised (private repo, GitHub Free minutes):
# - only on pull requests, and only when code, tests or scripts change
# - a newer push cancels the run still going for the same PR
# - one job: vet, gofmt, unit tests and the API-server restore drill
#   (two real API servers, no Docker, ~20s)
# - the slower kind drill (running controllers) only when the PR carries the
#   "full-drill" label, or when started by hand
# The local Tilt loop runs all of this for free before anything is pushed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # templates: the AWS read add-on is generated JSON, and a pull request
    # changing only it must still be tested (review of #24).
    paths: ["**.go", "go.mod", "go.sum", "testdata/**", "scripts/**", "examples/**", ".github/workflows/**", "internal/onboard/templates/**"]
  workflow_dispatch:
    inputs:
      full-drill:
        description: "Also run the kind drill"
        type: boolean
        default: true
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # A "labeled" event for any other label must not re-run the tests.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-drill'
    runs-on: ubuntu-latest
    env:
      TRUTHFORM_REQUIRE_KUBE_ASSETS: "1" # a missing API server fails CI instead of skipping
      TRUTHFORM_REQUIRE_BOOTSTRAP_TOOLS: "1" # and so does a missing bash, jq or cmp for the bootstrap script's test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: ~/.cache/truthform/envtest
          key: envtest-1.37.0
      # Fetched into a variable first: inside `echo "X=$(...)"` a failing
      # script is ignored and the step passes with an empty path (PR #5's
      # first run did exactly that, and only the tests' guard caught it).
      - name: Fetch etcd and kube-apiserver
        run: |
          assets="$(bash scripts/envtest-assets.sh)"
          test -d "$assets" || { echo "envtest assets missing: '$assets'"; exit 1; }
          ls "$assets"
          echo "TRUTHFORM_KUBE_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The inventories read, and restores write, with many goroutines; the race
      # detector needs cgo, which the Windows dev machines lack, so it runs
      # here, on those packages only (a few seconds).
      - run: go test -race -count=1 ./internal/awscc/ ./internal/azarm/ ./internal/gcp/ ./internal/saas/ ./internal/schedule/
      # The capture-only build (handed to clients for information
      # gathering) must refuse restore; it is a separate build, so test it.
      - run: go test -tags captureonly -count=1 ./cmd/truthform/
  drill-kind:
    if: (github.event_name == 'workflow_dispatch' && inputs.full-drill) || contains(github.event.pull_request.labels.*.name, 'full-drill')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: pip install pyyaml
      - run: KEEP=0 bash scripts/drill-kind.sh
