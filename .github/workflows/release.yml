name: release
# Builds the release binaries when a version tag is pushed (git tag v0.1.0
# && git push origin v0.1.0) and attaches them to a DRAFT release: nothing
# reaches anyone until a person reads the draft and publishes it. The repo
# is private, so its releases are too.
#
# Cost: one job per tag, a few minutes of build; nothing runs on branches.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # creating the draft release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the ancestry check below needs main's history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Only what main holds is released: a tag on a side branch would ship
      # code no pull request's checks ran on.
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      # Everything CI runs, on the exact commit released: main is not
      # protected (a private repo on GitHub Free), so that a commit is on
      # main does not prove its checks passed (review of #20).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/truthform/envtest
          key: envtest-1.37.0
      - name: Fetch etcd and kube-apiserver
        run: |
          assets="$(bash scripts/envtest-assets.sh)"
          test -d "$assets" || { echo "envtest assets missing: '$assets'"; exit 1; }
          echo "TRUTHFORM_KUBE_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          TRUTHFORM_REQUIRE_KUBE_ASSETS: "1"
      - run: go test -race -count=1 ./internal/awscc/ ./internal/azarm/ ./internal/gcp/ ./internal/saas/ ./internal/schedule/
      # The capture-only edition is what a client is handed.
      - run: go test -tags captureonly -count=1 ./cmd/truthform/
      # A release without it builds and passes, and its docs describe a
      # Cloudflare sign-in it cannot make: refuse it instead.
      - run: |
          if [ -z "$TRUTHFORM_CLOUDFLARE_CLIENT_ID" ]; then
            echo "repository variable TRUTHFORM_CLOUDFLARE_CLIENT_ID is not set; the release would have no Cloudflare sign-in"
            exit 1
          fi
        env:
          TRUTHFORM_CLOUDFLARE_CLIENT_ID: ${{ vars.TRUTHFORM_CLOUDFLARE_CLIENT_ID }}
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME"
        env:
          # TruthForm's Cloudflare OAuth client: public, not a secret, kept
          # out of the source. Unset, the build signs in to Cloudflare by
          # token only.
          TRUTHFORM_CLOUDFLARE_CLIENT_ID: ${{ vars.TRUTHFORM_CLOUDFLARE_CLIENT_ID }}
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --draft $pre --verify-tag --title "TruthForm $GITHUB_REF_NAME" --generate-notes
