name: aws-reads
# Weekly: regenerates the AWS read add-on (the reads a capture role needs
# that AWS's ReadOnlyAccess lacks) and opens or refreshes one pull request
# when what a role would be given changed. Every source is public (AWS's
# documentation, Service Reference and API models), so this holds no AWS
# credentials.
#
# Cost: one short job a week (generate and test, about two minutes); CI
# on the pull request only when the add-on changed, without the kind
# drill.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write # push the branch
  pull-requests: write # open or update the pull request
  actions: write # start CI on the branch (see below)
# One run at a time: two would race to push the same branch.
concurrency:
  group: aws-reads
  cancel-in-progress: false
env:
  BRANCH: aws-reads/regenerate
jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A stalled download must not bill for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not left in .git/config while go run and go test
          # execute third-party module code; it is given to git only for
          # the push below (review of #24).
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./internal/onboard/awsreads/gen
      # The file a role is given is checked here too: only reads, each
      # policy within IAM's limit.
      - run: go test -count=1 ./internal/onboard/...
      - name: Open or refresh the pull request if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "Regenerate the AWS read add-on

          AWS changed ReadOnlyAccess, the CloudFormation registry, its
          Service Reference or its API models. Review the diff of
          aws-read-addon.json: it is what a capture role is given."
          # One branch, replaced each time: while a regeneration is waiting
          # for review, the next one updates it instead of opening another
          # pull request (review of #24).
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          open="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh pr create --base main --head "$BRANCH" --title "Regenerate the AWS read add-on" \
              --body "Weekly regeneration (workflow aws-reads). Review the actions added and removed in internal/onboard/templates/aws-read-addon.json, and the unverified and omittedByReadOnlyAccess lists: a capture role is given these."
          else
            gh pr comment "$open" --body "Regenerated again by run ${GITHUB_RUN_ID}: the branch now holds the latest add-on."
          fi
          # A pull request opened or pushed with this workflow's token
          # triggers no workflows, so CI would never run on it.
          # workflow_dispatch is allowed from this token: start CI on the
          # branch explicitly, without the kind drill.
          gh workflow run ci.yml --ref "$BRANCH" -f full-drill=false
