gitops:
  notInGit:
  - namespace: legacy
    workloads:
    - CronJob sweep
    - Deployment worker
  notSeen:
  - '3 source(s) whose content was not available to check: Argo CD application billing,
    Flux HelmRelease ops/tool, Flux Kustomization flux-system/tenants.'
  - '1 HelmRelease(s) were read by their values only: what a chart''s templates render,
    and the defaults in the chart, were not.'
  - '1 object(s) the capture left to a Kustomization are not in the files read for
    it (generated by a chart or a generator, or from somewhere else): not checked.
    Each is named under its source.'
  - 'The files were read as written, not built: what a kustomize patch, replacement,
    name prefix or generator changes is not seen, and a reference is listed where
    it is written, which may be a base several overlays share.'
  - '2 reference(s) are in files this cluster''s Flux does not apply, followed from
    the Kustomization(s) the snapshot holds: listed, and not counted.'
  - '1 value(s) hold a ${...} that Flux fills in after the build (postBuild): read
    as written, so a registry or host given that way is seen only where the variable
    is defined in these files.'
  - '1 kustomize resource(s) are fetched from a URL: not read.'
  - '1 file(s) are not YAML as written (a chart''s templates): read line by line for
    Azure host names only: charts/local/templates/deployment.yaml.'
  - 'Only the checkout as it is was read: no other branch, and no other repository
    a source may read.'
  - '1 ExternalSecret(s) read a store that is not among what was read: whether it
    is a Key Vault''s cannot be told.'
  - 'Secret values are in neither input: a connection string or address kept in a
    Secret, or in the secret store, still names Azure and is not listed.'
  - What the applications' own code and images name is not visible here.
  - 'Only Flux''s sources are followed: Argo CD applications and Crossplane composites
    are named, and what they apply is not read.'
  read:
  - 'a Kubernetes snapshot: 9 object(s), and 11 more the capture left to 6 GitOps
    source(s)'
  - 'a checkout of the repository: 25 YAML document(s) in 15 file(s), and 2 other
    text file(s)'
  references:
  - appliedBy: Flux Kustomization flux-system/apps
    field: spec.values.image.repository
    file: apps/base/charts.yaml
    line: 29
    names: shopacr.azurecr.io/shop/worker
    object: HelmRelease shop/worker
    state: change
    target: '{{truthform|account|self|id}}.dkr.ecr.eu-west-1.amazonaws.com/shopacr/shop/worker'
    variable: registry_shopacr
    what: image
    why: 'the account is not known offline: {{truthform|account|self|id}} stands for
      it, as in the AWS snapshot'
  - appliedBy: Flux Kustomization flux-system/apps
    field: spec.values.serviceAccount.annotations["azure.workload.identity/client-id"]
    file: apps/base/charts.yaml
    line: 33
    names: Azure Workload Identity client ID (annotation azure.workload.identity/client-id)
    object: HelmRelease shop/worker
    state: check
    target: 'eks.amazonaws.com/role-arn: <the role''s ARN> (IAM roles for service
      accounts), or no annotation and an EKS Pod Identity association of the role
      with this service account'
    what: identity
    why: 'which role or service account is the identity translation''s: this names
      only the form the target reads'
