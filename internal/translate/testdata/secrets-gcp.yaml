report:
  destinations:
  - 'secrets: secret-manager'
  entries:
  - losses:
    - field: properties.enableRbacAuthorization
      why: 'who may read its secrets was set by Azure RBAC role assignments: identity
        is not translated (#32), so on the target only those its IAM lets read them
        can'
    reason: 'Secret Manager has no vault: its secrets are written as secrets of their
      own, named after the vault'
    source: Microsoft.KeyVault/vaults app/open
    state: mapped with losses
  - losses:
    - field: properties.accessPolicies
      why: '2 access policies set who may read its secrets: identity is not translated
        (#32), so on the target only those its IAM lets read them can'
    - field: properties.enabledForTemplateDeployment
      why: 'true: ARM deployments could read its secrets; nothing on the target does
        so'
    - field: properties.sku.name
      why: 'premium: its keys could be HSM-protected; its secrets were stored as a
        standard vault''s are, and keys are not translated'
    - field: tags
      why: '1 tag(s): Secret Manager has no vault to hold them (each secret keeps
        its own)'
    - field: properties.networkAcls
      why: 'its firewall denies by default, allowing 1 address range(s) and 0 network(s);
        Secret Manager answers on Google''s public endpoint to whoever IAM allows:
        it has no network setting of its own, and the VPC Service Controls perimeter
        that closes it (secretmanager.googleapis.com, for the whole project) is written
        only into an access policy the map names (privateAccess.accessPolicy)'
      widens: true
    - field: properties.enableSoftDelete
      why: 'a deleted secret was kept 30 days and could be recovered; Secret Manager
        deletes a secret at once, with every version, until an IAM deny policy denies
        secretmanager.secrets.delete (identity, not translated: #32)'
      widens: true
    - field: properties.enablePurgeProtection
      why: no one could purge a deleted secret before its retention was out; on Secret
        Manager whoever may delete a secret destroys it
      widens: true
    reason: 'Secret Manager has no vault: its secrets are written as secrets of their
      own, named after the vault'
    source: Microsoft.KeyVault/vaults app/shop
    state: mapped with losses
  - reason: 'identity is not translated (#32): an access policy grants an Azure identity
      rights on the vault; grant the app''s new identity read on its secrets instead'
    source: Microsoft.KeyVault/vaults/accessPolicies app/shop/add
    state: refused
  - reason: 'a key''s material never leaves its vault (its HSM or software protection),
      so it cannot be copied: make a new key in Cloud KMS and re-encrypt or re-sign
      what this one protected'
    source: Microsoft.KeyVault/vaults/keys app/shop/signing
    state: refused
  - reason: 'a key''s material never leaves its vault (its HSM or software protection),
      so it cannot be copied: make a new key in Cloud KMS and re-encrypt or re-sign
      what this one protected'
    source: Microsoft.KeyVault/vaults/keys/versions app/shop/signing/0123
    state: refused
  - reason: made when its private endpoint is created; private endpoints are not translated
      yet
    source: Microsoft.KeyVault/vaults/privateEndpointConnections app/shop/pe-1
    state: not looked at
  - reason: its vault is not in the snapshot, so what guarded it (its network rules,
      purge protection) is not known
    source: Microsoft.KeyVault/vaults/secrets app/gone/orphan
    state: refused
  - losses:
    - field: properties.attributes.nbf
      why: 'not before 2023-11-14T22:13:20Z: Key Vault only records it (a read works
        outside it); Secrets Manager has no such date, and Secret Manager''s expireTime
        deletes the secret, so it is not written'
    source: Microsoft.KeyVault/vaults/secrets app/open/token
    state: mapped with losses
    targets:
    - secretmanager.googleapis.com/Secret projects/{{truthform|project}}/secrets/open_token
  - source: Microsoft.KeyVault/vaults/secrets app/shop/api-abc123
    state: mapped
    targets:
    - secretmanager.googleapis.com/Secret projects/{{truthform|project}}/secrets/shop_api-abc123
  - losses:
    - field: properties.attributes.exp
      why: 'expires 2030-01-01T00:00:00Z: Key Vault only records it (a read works
        outside it); Secrets Manager has no such date, and Secret Manager''s expireTime
        deletes the secret, so it is not written'
    - field: tags.Name
      why: a GCP label takes lowercase letters, digits, _ and - only (a key starts
        with a letter), so it is not carried over
    - field: tags.Owner Team
      why: a GCP label takes lowercase letters, digits, _ and - only (a key starts
        with a letter), so it is not carried over
    source: Microsoft.KeyVault/vaults/secrets app/shop/db-password
    state: mapped with losses
    targets:
    - secretmanager.googleapis.com/Secret projects/{{truthform|project}}/secrets/shop_db-password
  - losses:
    - field: properties.value
      why: 'a value in the snapshot is not carried over: a translation writes no secret
        value'
    - field: properties.attributes.enabled
      why: 'disabled on the source, so no read returned its value; a Secret Manager
        secret is not disabled, its versions are: it is written with no version, and
        stays unreadable only while none is added'
    source: Microsoft.KeyVault/vaults/secrets app/shop/legacy
    state: mapped with losses
    targets:
    - secretmanager.googleapis.com/Secret projects/{{truthform|project}}/secrets/shop_legacy
  from: azure
  requirements:
  - Apps that read Key Vault app/open (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secret Manager instead, by the new names (<vault>_<secret>)
  - Apps that read Key Vault app/shop (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secret Manager instead, by the new names (<vault>_<secret>)
  - 'Key Vault app/open let Azure RBAC role assignments read its secrets; identity
    is not translated (#32): grant each app''s new identity roles/secretmanager.secretAccessor
    on the secrets it reads'
  - 'Key Vault app/open''s secrets (open_token) are created with no version: a capture
    never reads a value, a translation writes none, and the GCP restore takes none.
    After the restore, add each one''s value as a version (gcloud secrets versions
    add <id> --data-file=-), read from where it is kept'
  - 'Key Vault app/shop let 2 access policies read its secrets; identity is not translated
    (#32): grant each app''s new identity roles/secretmanager.secretAccessor on the
    secrets it reads'
  - 'Key Vault app/shop''s secrets (shop_api-abc123, shop_db-password, shop_legacy)
    are created with no version: a capture never reads a value, a translation writes
    none, and the GCP restore takes none. After the restore, add each one''s value
    as a version (gcloud secrets versions add <id> --data-file=-), read from where
    it is kept'
  - 'Secret shop_legacy was disabled on the source: add no version to it (or add one
    disabled) for as long as it should stay unreadable'
  - 'To close Secret Manager to the internet as Key Vault app/shop was, name an existing
    access policy and a perimeter in the map (privateAccess.accessPolicy: accessPolicies/<number>,
    privateAccess.perimeter: <name>) and how restores and captures pass it (privateAccess.restoreIdentity:
    serviceAccount:<email>, or privateAccess.restoreFromInside: true): a VPC Service
    Controls perimeter is then written that restricts secretmanager.googleapis.com
    for the whole target project. The access policy is the organization''s to create
    (gcloud access-context-manager policies create, scoped to the project or not)'
  to: gcp
snapshots:
  gcp:
  - apiVersion: gcp.truthform.org/v1
    kind: secretmanager.googleapis.com/Secret
    metadata:
      annotations:
        truthform.org/collection: projects.secrets
        truthform.org/discovery: secretmanager/v1
        truthform.org/parent: projects/{{truthform|project}}
        truthform.org/schema: Secret
      name: projects/{{truthform|project}}/secrets/open_token
    spec:
      replication:
        userManaged:
          replicas:
          - location: europe-west1
          - location: europe-west4
  - apiVersion: gcp.truthform.org/v1
    kind: secretmanager.googleapis.com/Secret
    metadata:
      annotations:
        truthform.org/collection: projects.secrets
        truthform.org/discovery: secretmanager/v1
        truthform.org/parent: projects/{{truthform|project}}
        truthform.org/schema: Secret
      name: projects/{{truthform|project}}/secrets/shop_api-abc123
    spec:
      replication:
        userManaged:
          replicas:
          - location: europe-west1
          - location: europe-west4
  - apiVersion: gcp.truthform.org/v1
    kind: secretmanager.googleapis.com/Secret
    metadata:
      annotations:
        truthform.org/collection: projects.secrets
        truthform.org/discovery: secretmanager/v1
        truthform.org/parent: projects/{{truthform|project}}
        truthform.org/schema: Secret
      name: projects/{{truthform|project}}/secrets/shop_db-password
    spec:
      annotations:
        content-type: text/plain
      labels:
        env: dev
      replication:
        userManaged:
          replicas:
          - location: europe-west1
          - location: europe-west4
  - apiVersion: gcp.truthform.org/v1
    kind: secretmanager.googleapis.com/Secret
    metadata:
      annotations:
        truthform.org/collection: projects.secrets
        truthform.org/discovery: secretmanager/v1
        truthform.org/parent: projects/{{truthform|project}}
        truthform.org/schema: Secret
      name: projects/{{truthform|project}}/secrets/shop_legacy
    spec:
      replication:
        userManaged:
          replicas:
          - location: europe-west1
          - location: europe-west4
