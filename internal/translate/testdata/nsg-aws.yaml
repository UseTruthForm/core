  from: azure
  requirements:
  - 'Flow log records under arn:aws:s3:::shop-flow-logs/azure/ expire after 30 day(s),
    as on Azure: set that in the bucket''s lifecycle rules (not written here)'
  - 'Flow logs are billed by volume on the target: they are written only where the
    source logged, unless the map asks for them everywhere'
  - 'Flow logs are delivered to arn:aws:s3:::shop-flow-logs/azure/ by delivery.logs.amazonaws.com:
    the bucket''s policy must let it write (s3:PutObject under AWSLogs/, s3:GetBucketAcl),
    which AWS adds itself only when whoever creates the flow log owns the bucket and
    may change its policy (docs.aws.amazon.com/vpc/latest/userguide/flow-logs-s3-permissions.html)'
  - 'Interface VPC endpoints are billed per endpoint and zone by the hour, and per
    gigabyte: the translation writes one per service and VPC that had a private endpoint'
  - 'Security group aks-nsg takes the place of an NSG on subnet(s) core-aks: an AWS
    security group applies only to what attaches it, so attach it to the instances
    (and node groups) in them'
  - 'Security group api marks the members of application security group sec/api and
    has no rules of its own: what takes the place of each member carries it beside
    its own group (members on Azure: virtual machine vm2)'
  - 'Security group app-nsg takes the place of an NSG on subnet(s) core-app: an AWS
    security group applies only to what attaches it, so attach it to the instances
    (and node groups) in them'
  - 'Security group batch marks the members of application security group sec/batch
    and has no rules of its own: what takes the place of each member carries it beside
    its own group (members on Azure: virtual machine vm4)'
  - 'Security group data-nsg takes the place of an NSG on subnet(s) core-data: an
    AWS security group applies only to what attaches it, so attach it to the instances
    (and node groups) in them'
  - 'Security group db marks the members of application security group sec/db and
    has no rules of its own: what takes the place of each member carries it beside
    its own group (members on Azure: virtual machine vm3)'
  - 'Security group pe-nsg takes the place of an NSG on subnet(s) core-pe, core-legacy:
    an AWS security group applies only to what attaches it, so attach it to the instances
    (and node groups) in them'
  - Security group spare-nsg is written in VPC core attached to nothing, as its NSG
    was
  - 'Security group web marks the members of application security group sec/web and
    has no rules of its own: what takes the place of each member carries it beside
    its own group (members on Azure: virtual machine vm1, virtual machine vm3)'
  - 'The interface endpoints in VPC core are in one availability zone (eu-west-1a),
    as Azure''s private endpoints were in one subnet: add a subnet in another zone
    for them to survive the loss of that one'
  - 'VPC flow log records are in the fixed format `${version} ${account-id} ${interface-id}
    ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start}
    ${end} ${action} ${log-status} ${vpc-id} ${subnet-id} ${instance-id} ${tcp-flags}
    ${type} ${pkt-srcaddr} ${pkt-dstaddr} ${region} ${az-id} ${flow-direction} ${traffic-path}
    ${reject-reason} ${encryption-status}`, one line per flow and direction every
    minute: a parser relies on that order (the guide''s record-field table)'
  - 'What takes the place of virtual machine vm1 (Microsoft.Network/networkInterfaces
    sec/vm1-nic) carries security group(s) app-nsg-vm-nsg, web and no other translated
    from an NSG: security groups on one interface add up, so the group of either NSG
    alone beside it would let through what the other denied'
  - 'What takes the place of virtual machine vm2 (Microsoft.Network/networkInterfaces
    sec/vm2-nic) carries security group(s) app-nsg-as-api, api and no other translated
    from an NSG: security groups on one interface add up, so the group of either NSG
    alone beside it would let through what the other denied'
  - 'What takes the place of virtual machine vm3 (Microsoft.Network/networkInterfaces
    sec/vm3-nic) carries security group(s) data-nsg, db, web and no other translated
    from an NSG: security groups on one interface add up, so the group of either NSG
    alone beside it would let through what the other denied'
  - 'What takes the place of virtual machine vm4 (Microsoft.Network/networkInterfaces
    sec/vm4-nic) carries security group(s) vm-nsg, batch and no other translated from
    an NSG: security groups on one interface add up, so the group of either NSG alone
    beside it would let through what the other denied'
  - 'What takes the place of virtual machine vm5 (Microsoft.Network/networkInterfaces
    sec/vm5-nic) carries security group(s) app-nsg and no other translated from an
    NSG: security groups on one interface add up, so the group of either NSG alone
    beside it would let through what the other denied'
  to: aws
