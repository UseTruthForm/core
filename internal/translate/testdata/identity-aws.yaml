  from: azure
  requirements:
  - 'A cluster''s workloads are not in this translation: restore TruthForm''s Kubernetes
    snapshot of Microsoft.ContainerService/managedClusters rg/shop into the EKS cluster
    once it runs; persistent volumes'' data is not moved, and is copied on its own'
  - 'A repository is made on push only for a principal allowed ecr:CreateRepository
    as well as to push: grant the pipelines that push images both (identity, not translated:
    #32)'
  - An IAM role written for a managed identity can be given to another service account
    by whoever may create EKS Pod Identity associations and pass the role (eks:CreatePodIdentityAssociation,
    iam:PassRole), as whoever could write the identity's federated credentials could
    on Azure; the role's own trust policy also names each cluster, namespace and service
    account, so such an association gets no credentials until that is changed too
  - 'Apps move from the Azure Blob SDK to the S3 API: each container is a bucket,
    named <account>-<container> unless the map names it'
  - 'Apps move from the Service Bus SDK to the AWS SDK: a queue is an SQS queue, a
    topic an SNS topic delivering to an SQS queue per subscription, and a subscription''s
    filter matches SNS message attributes'
  - Apps that reached Azure through a managed identity use the AWS SDK's default credential
    chain, at a version that knows EKS Pod Identity (https://docs.aws.amazon.com/eks/latest/userguide/pod-id-minimum-sdk.html),
    and no static credential earlier in that chain
  - Apps that read Key Vault rg/oldkv (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secrets Manager instead, by the new names (<vault>/<secret>)
  - Apps that read Key Vault rg/shopkv (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secrets Manager instead, by the new names (<vault>/<secret>)
  - Apps that sign in to Azure Storage with account keys, SAS tokens or connection
    strings must move to the target's identity (IAM roles, workload identity); no
    key or SAS is carried over
  - 'Blobs are not copied: each bucket is written empty. Copy each container''s blobs
    into its bucket (AWS DataSync or S3 Batch Operations; the Storage Transfer Service),
    with their versions, metadata and per-blob tiers and holds, which this translation
    does not carry'
  - 'EKS cluster shop takes no one''s access from Azure: add access entries for the
    people and tools that use it before restoring its workloads (#32)'
  - 'EKS cluster shop''s API server answers only inside its VPC: kubectl and the restore
    of its workloads run from there'
  - 'EKS cluster shop''s nodes pulled their images with the kubelet identity''s AcrPull:
    let the node role (clusters.rg/shop.nodeRoleArn) pull from ECR, with ecr:GetAuthorizationToken
    on * and ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and ecr:BatchCheckLayerAvailability
    on arn:aws:ecr:eu-west-1:<account>:repository/shopacr/* (the managed policy AmazonEC2ContainerRegistryPullOnly
    gives the same on every repository)'
  - 'EKS cluster shop: workload identity is EKS Pod Identity, whose agent add-on (eks-pod-identity-agent)
    is written here. Its nodes'' role (clusters.rg/shop.nodeRoleArn) must allow eks-auth:AssumeRoleForPodIdentity
    (the managed policy AmazonEKSWorkerNodePolicy does), and nodes with no route to
    the internet reach the EKS Auth API through an interface endpoint (com.amazonaws.eu-west-1.eks-auth)'
  - 'EKS validates Kubernetes 1.31 at restore: if it no longer offers that version,
    a person chooses one, as the translation never upgrades'
  - 'Images are not copied: copy each from abacacr.azurecr.io to <account>.dkr.ecr.eu-west-1.amazonaws.com/abacacr/<repository>
    (crane copy, skopeo copy) before a restore of what pulls them. The Kubernetes
    image references are not rewritten: the translation''s Kubernetes change list
    names each one and what it becomes, for the repository''s owner to change'
  - 'Images are not copied: copy each from shopacr.azurecr.io to <account>.dkr.ecr.eu-west-1.amazonaws.com/shopacr/<repository>
    (crane copy, skopeo copy) before a restore of what pulls them. The Kubernetes
    image references are not rewritten: the translation''s Kubernetes change list
    names each one and what it becomes, for the repository''s owner to change'
  - 'Key Vault rg/oldkv''s secrets (oldkv/token) hold no value: a capture never reads
    one, and a translation writes none. Supply each at restore with --values (AWS::SecretsManager::Secret/<name>:
    {SecretString: ...}), read from where its value is kept; the restore lists each
    one created without it'
  - 'Key Vault rg/shopkv let Azure RBAC role assignments read its secrets; a managed
    identity''s Key Vault Secrets role is carried over with destinations.identity:
    workload; for anyone else (people, pipelines, access policies) grant secretsmanager:GetSecretValue
    on the secrets they read'
  - 'Key Vault rg/shopkv''s secrets (shopkv/api-key, shopkv/db-password) hold no value:
    a capture never reads one, and a translation writes none. Supply each at restore
    with --values (AWS::SecretsManager::Secret/<name>: {SecretString: ...}), read
    from where its value is kept; the restore lists each one created without it'
  - 'Kubernetes manifests (Git): a service account needs no annotation for EKS Pod
    Identity, which binds by cluster, namespace and name; remove the azure.workload.identity/client-id
    annotations and azure.workload.identity/use labels.'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the cluster''s service account
    token issuer changes: federated credentials that trusted the AKS issuer are carried
    over with destinations.identity: workload (EKS Pod Identity, GKE workload identity),
    and made again by hand otherwise'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the nodes reached the internet
    through Azure''s outbound (loadBalancer); the target''s subnets have no internet
    egress until a NAT gateway (AWS) or Cloud NAT (GCP) is added, and nodes cannot
    pull public images without it'
  - 'Microsoft.ContainerService/managedClusters rg/shop: workloads signed in to Azure
    with workload identity; on the target they use EKS Pod Identity or GKE workload
    identity, which destinations.identity: workload writes for each managed identity;
    without it, set it up on its own. Either way the app''s credentials change'
  - 'People, groups and pipelines are not translated: who had roles in Azure (each
    refused role assignment names one) is given access on the target through its own
    IAM and the customer''s directory'
  - 'Who may read and write each bucket is IAM. With destinations.identity: workload,
    a managed identity''s Storage Blob Data role on the account or a container is
    carried to its bucket; a person''s, a pipeline''s or a custom role''s is not:
    grant those on the target'
  to: aws
