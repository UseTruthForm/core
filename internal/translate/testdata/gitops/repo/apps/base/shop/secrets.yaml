apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web
  namespace: shop
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: 00000000-0000-0000-0000-0000000000aa
    keyvaultName: shop
    tenantID: 00000000-0000-0000-0000-0000000000bb
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: api-abc123
          objectAlias: API_KEY
          objectType: secret
          objectVersion: 0123456789abcdef0123456789abcdef
        - |
          objectName: signing
          objectType: key
        - |
          objectName: not-there
          objectType: secret
  secretObjects:
    - secretName: web
      type: Opaque
      data:
        - objectName: db-password
          key: password
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: shop
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://open.vault.azure.net
      serviceAccountRef:
        name: web
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: token
  namespace: shop
spec:
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: token
  data:
    - secretKey: token
      remoteRef:
        key: secret/token
    - secretKey: cert
      remoteRef:
        key: cert/frontdoor
  dataFrom:
    - find:
        name:
          regexp: ^feature-
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: other
  namespace: shop
spec:
  secretStoreRef:
    name: platform
    kind: ClusterSecretStore
  data:
    - secretKey: x
      remoteRef:
        key: x
