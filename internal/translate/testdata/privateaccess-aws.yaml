      RepositoryPolicy: '{"Statement":[{"Action":["ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability","ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage"],"Condition":{"BoolIfExists":{"aws:PrincipalIsAWSService":"false"},"StringNotEquals":{"aws:SourceVpce":["{{truthform|AWS::EC2::VPCEndpoint|core-ecr-api|Id}}","{{truthform|AWS::EC2::VPCEndpoint|core-ecr-dkr|Id}}"]}},"Effect":"Deny","Principal":"*","Sid":"DenyOutsidePrivateAccess"}],"Version":"2012-10-17"}'
