        allowCrossOrgVpcs: false
        mode: Enabled
      location: EUROPE-WEST1
      name: shopvault-backups
      softDeletePolicy:
        retentionDurationSeconds: "7776000"
      storageClass: NEARLINE
      versioning:
        enabled: true
