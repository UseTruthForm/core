    stackdna.org/after:
      - Microsoft.ManagedIdentity/userAssignedIdentities|rg-app/id-app
    stackdna.org/api-version: "2024-04-01"
    stackdna.org/id: /subscriptions/{{stackdna|subscription}}/resourceGroups/rg-app/providers/Microsoft.Web/sites/web
  name: web
  namespace: rg-app
spec:
