  from: azure
  requirements:
  - 'A GKE cluster''s workload identity pool is its project''s (<project>.svc.id.goog):
    a service account of the same namespace and name in any other cluster of the target
    project, now or later, is the same principal and gets the same access. Keep clusters
    that must not share identities in separate projects'
  - 'A cluster''s workloads are not in this translation: restore TruthForm''s Kubernetes
    snapshot of Microsoft.ContainerService/managedClusters rg/shop into the GKE cluster
    once it runs; persistent volumes'' data is not moved, and is copied on its own'
  - 'Apps move from the Azure Blob SDK to the Cloud Storage client: each container
    is a bucket, named <account>-<container> unless the map names it'
  - 'Apps move from the Service Bus SDK to the Pub/Sub client: a queue is a topic
    with one subscription of its name, and a subscription''s filter matches message
    attributes'
  - 'Apps that reached Azure through a managed identity use Google''s client libraries
    with Application Default Credentials. A pod on the host network (hostNetwork:
    true) does not get its service account''s identity on GKE: it acts as the node''s
    service account'
  - Apps that read Key Vault rg/oldkv (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secret Manager instead, by the new names (<vault>_<secret>)
  - Apps that read Key Vault rg/shopkv (its SDK, Key Vault references, the Secrets
    Store CSI driver) read Secret Manager instead, by the new names (<vault>_<secret>)
  - Apps that sign in to Azure Storage with account keys, SAS tokens or connection
    strings must move to the target's identity (IAM roles, workload identity); no
    key or SAS is carried over
  - 'Blobs are not copied: each bucket is written empty. Copy each container''s blobs
    into its bucket (AWS DataSync or S3 Batch Operations; the Storage Transfer Service),
    with their versions, metadata and per-blob tiers and holds, which this translation
    does not carry'
  - 'GKE cluster shop is given the project''s workload identity pool and its node
    pools the GKE metadata server (workloadMetadataConfig GKE_METADATA), for workload
    identity: a pod no longer reaches its node''s service account through the metadata
    server, and a pod that relied on the node''s identity needs a service account
    of its own'
  - 'GKE cluster shop takes no one''s access from Azure: grant the people and tools
    that use it IAM roles on the project, and RBAC in the cluster, before restoring
    its workloads (#32)'
  - 'GKE cluster shop''s API server answers only inside its VPC network: kubectl and
    the restore of its workloads run from there'
  - 'GKE cluster shop''s nodes pulled their images with the kubelet identity''s AcrPull:
    grant each node pool''s service account roles/artifactregistry.reader on the repository:
    gcloud artifacts repositories add-iam-policy-binding shopacr --location=europe-west1
    --member=serviceAccount:<node service account> --role=roles/artifactregistry.reader'
  - 'GKE validates Kubernetes 1.31 at restore: if it no longer offers that version,
    a person chooses one, as the translation never upgrades'
  - 'Images are not copied: copy each from abacacr.azurecr.io to europe-west1-docker.pkg.dev/<project>/abacacr/<repository>
    (crane copy, skopeo copy) before a restore of what pulls them. The Kubernetes
    image references are rewritten in a later step'
  - 'Images are not copied: copy each from shopacr.azurecr.io to europe-west1-docker.pkg.dev/<project>/shopacr/<repository>
    (crane copy, skopeo copy) before a restore of what pulls them. The Kubernetes
    image references are rewritten in a later step'
  - 'Key Vault rg/oldkv''s secrets (oldkv_token) are created with no version: a capture
    never reads a value, a translation writes none, and the GCP restore takes none.
    After the restore, add each one''s value as a version (gcloud secrets versions
    add <id> --data-file=-), read from where it is kept'
  - 'Key Vault rg/shopkv let Azure RBAC role assignments read its secrets; identity
    is not translated (#32): grant each app''s new identity roles/secretmanager.secretAccessor
    on the secrets it reads'
  - 'Key Vault rg/shopkv''s secrets (shopkv_api-key, shopkv_db-password) are created
    with no version: a capture never reads a value, a translation writes none, and
    the GCP restore takes none. After the restore, add each one''s value as a version
    (gcloud secrets versions add <id> --data-file=-), read from where it is kept'
  - 'Kubernetes manifests (Git): service account orders in namespace shop of cluster
    shop carries the annotation iam.gke.io/gcp-service-account: orders-id@<project>.iam.gserviceaccount.com,
    in place of azure.workload.identity/client-id; remove the azure.workload.identity/use
    labels'
  - 'Kubernetes manifests (Git): service account web in namespace shop of cluster
    shop carries the annotation iam.gke.io/gcp-service-account: web-id@<project>.iam.gserviceaccount.com,
    in place of azure.workload.identity/client-id; remove the azure.workload.identity/use
    labels'
  - 'Kubernetes manifests (Git): service account web-jobs in namespace jobs of cluster
    shop carries the annotation iam.gke.io/gcp-service-account: web-id@<project>.iam.gserviceaccount.com,
    in place of azure.workload.identity/client-id; remove the azure.workload.identity/use
    labels'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the cluster''s service account
    token issuer changes: federated credentials that trusted the AKS issuer are made
    again against the target''s (#32)'
  - 'Microsoft.ContainerService/managedClusters rg/shop: the nodes reached the internet
    through Azure''s outbound (loadBalancer); the target''s subnets have no internet
    egress until a NAT gateway (AWS) or Cloud NAT (GCP) is added, and nodes cannot
    pull public images without it'
  - 'Microsoft.ContainerService/managedClusters rg/shop: workloads signed in to Azure
    with workload identity; on the target they use EKS Pod Identity or IRSA, or GKE
    workload identity, set up on its own: the app''s credentials change (#32)'
  - 'People, groups and pipelines are not translated: who had roles in Azure (each
    refused role assignment names one) is given access on the target through its own
    IAM and the customer''s directory'
  - Pub/Sub's service agent (service-<project-number>@gcp-sa-pubsub.iam.gserviceaccount.com)
    needs roles/pubsub.publisher on each dead-letter topic and roles/pubsub.subscriber
    on each subscription that dead-letters; no grant is written here
  - 'The IAM Service Account Credentials API (iamcredentials.googleapis.com) is enabled
    in the target project: a workload acts as its service account through it'
  - 'Who may read and write each bucket is IAM, which is not translated (#32): grant
    the app''s role or service account access to its bucket (Azure role assignments
    on the account are not carried over)'
  to: gcp
