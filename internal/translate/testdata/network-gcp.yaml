report:
  destinations:
  - 'network: vpc'
  entries:
  - source: Microsoft.Network/networkSecurityGroups net/data
    state: mapped
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-allow-8443-internet
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-allow-pg-from-app
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-allowvnetinbound
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-deny-app
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-deny-internet-out
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/data-deny-vnet-8443
  - reason: no subnet in the snapshot uses it (one on a network interface is not translated
      yet), so there is no network to put it in
    source: Microsoft.Network/networkSecurityGroups net/unused
    state: refused
  - losses:
    - field: properties.securityRules[deny-azurecloud]
      why: inbound deny rule deny-azurecloud (priority 150) names AzureCloud, which
        has no addresses here; it denies every address instead
    - field: properties.securityRules[allow-frontdoor]
      why: inbound allow rule allow-frontdoor (priority 400) allows AzureFrontDoor.Backend,
        which has no addresses here; it is not carried over
    - field: properties.securityRules[allow-ephemeral]
      why: inbound allow rule allow-ephemeral (priority 510) names source ports; a
        firewall rule cannot, so it is not carried over
    source: Microsoft.Network/networkSecurityGroups net/web
    state: mapped with losses
    targets:
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-8443
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-dns
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-https
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-mgmt-ssh
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allow-one-host
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-allowvnetinbound
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-deny-azurecloud
    - compute.googleapis.com/Firewall projects/{{truthform|project}}/global/firewalls/web-deny-ssh
  - losses:
    - field: properties.subnets[app].properties.defaultOutboundAccess
      why: it reached the internet through Azure's default outbound access; on the
        target it has no internet egress until a NAT gateway (AWS) or Cloud NAT (GCP)
        is added
    - field: properties.subnets[data].properties.routeTable
      why: 'its traffic follows a route table, which is not translated yet: if it
        sent traffic through a firewall appliance, the target does not'
      widens: true
    - field: tags
      why: '1 tag(s): a VPC network has no tags or labels to hold them'
    source: Microsoft.Network/virtualNetworks net/core
    state: mapped with losses
    targets:
    - compute.googleapis.com/Network projects/{{truthform|project}}/global/networks/core
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/core-app
    - compute.googleapis.com/Subnetwork projects/{{truthform|project}}/regions/europe-west1/subnetworks/core-data
  - reason: no descriptor for Microsoft.Network/virtualNetworks/virtualNetworkPeerings
      yet
    source: Microsoft.Network/virtualNetworks/virtualNetworkPeerings net/core/to-hub
    state: not looked at
  from: azure
  requirements:
  - 'Google''s load balancers check health from 35.191.0.0/16 and 130.211.0.0/22:
    where one fronts these instances, allow those ranges (Azure''s load balancer was
    allowed by every NSG)'
  - 'Instances (and GKE nodes) in subnetwork(s) core-app carry the network tag web:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  - 'Instances (and GKE nodes) in subnetwork(s) core-data carry the network tag data:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  to: gcp
