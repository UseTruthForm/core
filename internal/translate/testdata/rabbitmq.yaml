    - field: properties.deadLetteringOnMessageExpiration
      why: off on the source, so an expired message was dropped; RabbitMQ dead-letters
        expired messages too
    - field: properties.lockDuration
      why: a consumer that does not acknowledge in time has its channel closed and
        the message redelivered; there is no lock to renew
