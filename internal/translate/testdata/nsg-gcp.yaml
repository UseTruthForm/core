  from: azure
  requirements:
  - 'Flow log records are kept 30 day(s), as on Azure: set that as the retention of
    the Cloud Logging bucket that holds compute.googleapis.com/vpc_flows (not written
    here)'
  - 'Flow logs are billed by volume on the target: they are written only where the
    source logged, unless the map asks for them everywhere'
  - 'Google''s load balancers check health from 35.191.0.0/16 and 130.211.0.0/22:
    where one fronts these instances, allow those ranges (Azure''s load balancer was
    allowed by every NSG)'
  - 'Instances (and GKE nodes) in subnetwork(s) core-aks carry the network tag aks-nsg:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  - 'Instances (and GKE nodes) in subnetwork(s) core-app carry the network tag app-nsg:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  - 'Instances (and GKE nodes) in subnetwork(s) core-data carry the network tag data-nsg:
    an NSG applied to a whole subnet, a firewall rule applies to instances by tag'
  - 'Instances (and GKE nodes) in subnetwork(s) core-pe, core-legacy carry the network
    tag pe-nsg: an NSG applied to a whole subnet, a firewall rule applies to instances
    by tag'
  - 'Network tag asg-api marks the members of application security group sec/api:
    what takes the place of each member carries it (members on Azure: virtual machine
    vm2)'
  - 'Network tag asg-batch marks the members of application security group sec/batch:
    what takes the place of each member carries it (members on Azure: virtual machine
    vm4)'
  - 'Network tag asg-db marks the members of application security group sec/db: what
    takes the place of each member carries it (members on Azure: virtual machine vm3)'
  - 'Network tag asg-web marks the members of application security group sec/web:
    what takes the place of each member carries it (members on Azure: virtual machine
    vm1, virtual machine vm3, virtual machine vm6)'
  - Private Google Access reaches Google's APIs privately from machines with no external
    IP; a machine with one reaches them over the internet
  - 'VPC Flow Logs do not record packets an ingress firewall rule denied: turn on
    firewall rule logging (logConfig on the rules) where denied flows must be seen,
    as Azure''s flow logs showed them (state D)'
  - 'VPC Flow Logs go to Cloud Logging (log compute.googleapis.com/vpc_flows, resource
    type gce_subnetwork): where a security tool reads them from a bucket, BigQuery
    or Pub/Sub, add a Logging sink for that log (not written here)'
  - 'What takes the place of virtual machine vm1 (Microsoft.Network/networkInterfaces
    sec/vm1-nic) carries network tag(s) app-nsg-vm-nsg, asg-web and no other translated
    from an NSG: every rule that applies to an instance is in one list on GCP, so
    another NSG''s tag beside them would let through what these deny'
  - 'What takes the place of virtual machine vm2 (Microsoft.Network/networkInterfaces
    sec/vm2-nic) carries network tag(s) app-nsg, app-nsg-as-api, asg-api and no other
    translated from an NSG: every rule that applies to an instance is in one list
    on GCP, so another NSG''s tag beside them would let through what these deny'
  - 'What takes the place of virtual machine vm3 (Microsoft.Network/networkInterfaces
    sec/vm3-nic) carries network tag(s) data-nsg, asg-db, asg-web and no other translated
    from an NSG: every rule that applies to an instance is in one list on GCP, so
    another NSG''s tag beside them would let through what these deny'
  - 'What takes the place of virtual machine vm4 (Microsoft.Network/networkInterfaces
    sec/vm4-nic) carries network tag(s) vm-nsg, asg-batch and no other translated
    from an NSG: every rule that applies to an instance is in one list on GCP, so
    another NSG''s tag beside them would let through what these deny'
  - 'What takes the place of virtual machine vm5 (Microsoft.Network/networkInterfaces
    sec/vm5-nic) carries network tag(s) app-nsg and no other translated from an NSG:
    every rule that applies to an instance is in one list on GCP, so another NSG''s
    tag beside them would let through what these deny'
  - 'What takes the place of virtual machine vm6 (Microsoft.Network/networkInterfaces
    sec/vm6-nic) carries network tag(s) app-nsg, asg-web and no other translated from
    an NSG: every rule that applies to an instance is in one list on GCP, so another
    NSG''s tag beside them would let through what these deny'
  to: gcp
